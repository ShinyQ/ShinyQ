name: Refresh

# Keeps the README's live parts in step with https://shinyq.my.id: the headline numbers
# (from ShinyQ/ShinyQ-HQ content) and the latest writing (from the site's Atom feed).
on:
  schedule:
    - cron: "41 23 * * *" # daily 23:41 UTC (06:41 WIB)
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-bots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refresh facts and latest writing
        run: python3 scripts/refresh.py
      - name: Commit when it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh facts and latest writing"
          git pull --rebase --quiet
          git push
