name: Skyline

on:
  schedule:
    - cron: "17 0 * * 1" # Mondays 00:17 UTC (07:17 WIB)
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-bots
  cancel-in-progress: false

jobs:
  skyline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Draw the contribution skyline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/skyline.py
      - name: Commit when it changed
        run: |
          if git diff --quiet -- assets/hq-skyline.svg assets/hq-skyline-light.svg; then
            echo "Skyline unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/hq-skyline.svg assets/hq-skyline-light.svg
          git commit -m "Redraw contribution skyline"
          git pull --rebase --quiet
          git push
